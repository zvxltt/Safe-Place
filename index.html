/* ---------- STOCKAGE LOCAL (remplace window.storage, propre à Claude) ---------- */
window.storage = {
  get: async (key, shared) => {
    try {
      const raw = localStorage.getItem("evasafeplace:" + key);
      if (raw === null) return null;
      return { key, value: raw, shared: !!shared };
    } catch (e) {
      return null;
    }
  },
  set: async (key, value, shared) => {
    try {
      localStorage.setItem("evasafeplace:" + key, value);
      return { key, value, shared: !!shared };
    } catch (e) {
      return null;
    }
  },
  delete: async (key, shared) => {
    try {
      localStorage.removeItem("evasafeplace:" + key);
      return { key, deleted: true, shared: !!shared };
    } catch (e) {
      return null;
    }
  },
  list: async (prefix, shared) => {
    const keys = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith("evasafeplace:" + (prefix || ""))) keys.push(k.replace("evasafeplace:", ""));
    }
    return { keys, prefix, shared: !!shared };
  },
};

/* ---------- HELPERS ---------- */
const dateKey = (d) => {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
};
const todayKey = () => dateKey(new Date());
const dateFromKey = (key) => {
  const [y, m, d] = key.split("-").map(Number);
  return new Date(y, m - 1, d);
};
const uid = () => Math.random().toString(36).slice(2, 10);
const dayOfYear = (d) => {
  const start = new Date(d.getFullYear(), 0, 0);
  return Math.floor((d - start) / 86400000);
};
const formatTime = (s) => {
  const m = Math.floor(s / 60);
  const sec = s % 60;
  return `${String(m).padStart(2, "0")}:${String(sec).padStart(2, "0")}`;
};

/* ---------- STORAGE HOOK ---------- */
function useHubData() {
  const [data, setData] = useState(EMPTY);
  const [loaded, setLoaded] = useState(false);
  const saveTimer = useRef(null);

  useEffect(() => {
    (async () => {
      let initial = null;
      try {
        const res = await window.storage.get("hub-data");
        if (res && res.value) initial = JSON.parse(res.value);
      } catch (e) {
        // pas de données existantes
      }
      const CORRECT_ANCHOR = dateKey(new Date(2026, 7, 13)); // plaquette commencée le 13 août 2026
      if (!initial) {
        initial = {
          ...EMPTY,
          pillCycleAnchor: CORRECT_ANCHOR,
          pillTaken: {},
        };
      } else if (initial.pillCycleAnchor !== CORRECT_ANCHOR) {
        // corrige une ancienne date d'ancrage stockée précédemment
        initial = { ...initial, pillCycleAnchor: CORRECT_ANCHOR };
      }
      try {
        await window.storage.set("hub-data", JSON.stringify(initial));
      } catch (e) {}
      setData({ ...EMPTY, ...initial });
      setLoaded(true);
    })();
  }, []);

  const persist = (next) => {
    setData(next);
    if (saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(async () => {
      try {
        await window.storage.set("hub-data", JSON.stringify(next));
      } catch (e) {
        console.error("Erreur de sauvegarde", e);
      }
    }, 250);
  };

  return { data, persist, loaded };
}

/* ================= PILULES ================= */
function getDayInfo(key, anchorKey) {
  const diff = Math.round((dateFromKey(key) - dateFromKey(anchorKey)) / 86400000);
  const mod = ((diff % 28) + 28) % 28;
  if (mod < 21) return { type: "pill", dayInPack: mod + 1 };
  return { type: "break", dayInBreak: mod - 21 + 1 };
}

function PillsScreen({ data, persist }) {
  const [monthOffset, setMonthOffset] = useState(0);
  const anchor = data.pillCycleAnchor || todayKey();
  const today = todayKey();
  const todayInfo = getDayInfo(today, anchor);
  const nowHour = new Date().getHours();
  const showLateBanner = todayInfo.type === "pill" && !data.pillTaken[today] && nowHour >= 22;

  const toggleTaken = (key) => {
    persist({ ...data, pillTaken: { ...data.pillTaken, [key]: !data.pillTaken[key] } });
  };

  const base = new Date();
  base.setDate(1);
  base.setMonth(base.getMonth() + monthOffset);
  const year = base.getFullYear();
  const month = base.getMonth();
  const firstOfMonth = new Date(year, month, 1);
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const leading = (firstOfMonth.getDay() + 6) % 7; // lundi = 0

  const cells = [];
  for (let i = 0; i < leading; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);

  const monthLabel = base.toLocaleDateString("fr-FR", { month: "long", year: "numeric" });

  let remainingMsg = "";
  if (todayInfo.type === "pill") {
    const totalFromToday = 21 - todayInfo.dayInPack + 1;
    const remaining = totalFromToday - (data.pillTaken[today] ? 1 : 0);
    remainingMsg =
      remaining > 0
        ? `Il te reste ${remaining} pilule${remaining > 1 ? "s" : ""} à prendre avant la pause.`
        : "Dernière pilule de la plaquette aujourd'hui, prise !";
  } else {
    const daysLeftInBreak = 7 - todayInfo.dayInBreak + 1;
    remainingMsg = `Semaine sans pilule — reprise dans ${daysLeftInBreak} jour${daysLeftInBreak > 1 ? "s" : ""}.`;
  }

  return (
    <div>
      <Header title="Pilules" subtitle="Safe Place" />
      <div style={{ padding: "0 clamp(16px,5vw,22px)" }}>
        <Card style={{ background: todayInfo.type === "pill" ? ROSE_LIGHT : SAGE_LIGHT, border: "none" }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 10 }}>
            <div>
              <div style={{ fontSize: 13, color: todayInfo.type === "pill" ? ROSE_DARK : "#5C7449", fontWeight: 500 }}>
                {todayInfo.type === "pill" ? `Jour ${todayInfo.dayInPack} / 21` : `Pause — jour ${todayInfo.dayInBreak} / 7`}
              </div>
              <div style={{ fontSize: 14, color: TEXT, marginTop: 4 }}>{remainingMsg}</div>
            </div>
            {todayInfo.type === "pill" && (
              <button
                onClick={() => toggleTaken(today)}
                style={{
                  display: "flex",
                  alignItems: "center",
                  gap: 8,
                  border: "none",
                  borderRadius: 999,
                  padding: data.pillTaken[today] ? "10px 16px" : "10px 18px",
                  background: data.pillTaken[today] ? ROSE : "#fff",
                  color: data.pillTaken[today] ? "#fff" : ROSE_DARK,
                  boxShadow: data.pillTaken[today] ? "0 3px 10px rgba(140,90,100,0.25)" : `0 0 0 2px ${ROSE}`,
                  fontSize: 13.5,
                  fontWeight: 600,
                  cursor: "pointer",
                  flexShrink: 0,
                  whiteSpace: "nowrap",
                }}
              >
                <span
                  style={{
                    width: 22,
                    height: 22,
                    borderRadius: "50%",
                    border: data.pillTaken[today] ? "none" : `2px solid ${ROSE}`,
                    background: data.pillTaken[today] ? "rgba(255,255,255,0.25)" : "transparent",
                    display: "flex",
                    alignItems: "center",
                    justifyContent: "center",
                    flexShrink: 0,
                  }}
                >
                  {data.pillTaken[today] && <Check size={14} />}
                </span>
                {data.pillTaken[today] ? "Prise aujourd'hui" : "Valider ma pilule"}
              </button>
            )}
          </div>
        </Card>

        {showLateBanner && (
          <Card style={{ background: CORAL_LIGHT, border: "none", display: "flex", alignItems: "center", gap: 10 }}>
            <span style={{ fontSize: 18 }}>⏰</span>
            <span style={{ fontSize: 13, color: "#7A4A3D", fontWeight: 500 }}>
              Il est plus de 22h, n'oublie pas ta pilule ce soir !
            </span>
          </Card>
        )}

        <Card>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
            <IconButton onClick={() => setMonthOffset((m) => m - 1)}>
              <ChevronLeft size={18} />
            </IconButton>
            <span style={{ fontSize: 14, fontWeight: 500, color: TEXT, textTransform: "capitalize" }}>{monthLabel}</span>
            <IconButton onClick={() => setMonthOffset((m) => m + 1)}>
              <ChevronRight size={18} />
            </IconButton>
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(7,1fr)", gap: 4, marginBottom: 6 }}>
            {["L", "M", "M", "J", "V", "S", "D"].map((d, i) => (
              <div key={i} style={{ textAlign: "center", fontSize: 10, color: TEXT_MUTED }}>
                {d}
              </div>
            ))}
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(7,1fr)", gap: 4 }}>
            {cells.map((d, i) => {
              if (!d) return <div key={i} />;
              const key = dateKey(new Date(year, month, d));
              const info = getDayInfo(key, anchor);
              const isToday = key === today;
              const taken = !!data.pillTaken[key];
              return (
                <button
                  key={i}
                  onClick={() => info.type === "pill" && toggleTaken(key)}
                  style={{
                    aspectRatio: "1",
                    borderRadius: 10,
                    border: isToday ? `1.5px solid ${ROSE_DARK}` : "1px solid transparent",
                    background: info.type === "pill" ? (taken ? ROSE : ROSE_LIGHT) : SAGE_LIGHT,

function PilatesScreen({ data, persist }) {
  const [preview, setPreview] = useState(null);

    const favs = data.favoriteSessions || [];
    persist({
      ...data,
      favoriteSessions: favs.includes(id) ? favs.filter((f) => f !== id) : [...favs, id],
    });
  };

  const favoriteIds = data.favoriteSessions || [];

  if (preview) {
    return (
      <SessionDetail
        session={preview}
        onBack={() => setPreview(null)}
        data={data}
        persist={persist}
        isFav={favoriteIds.includes(preview.id)}
        onToggleFav={() => toggleFavorite(preview.id)}
      />
    );
  }

  // stats
  const allDates = Object.values(data.sessionHistory || {}).flat();
  const weekAgo = new Date();
  weekAgo.setDate(weekAgo.getDate() - 6);
  const sessionsThisWeek = allDates.filter((d) => dateFromKey(d) >= new Date(weekAgo.toDateString())).length;
  const totalMinutes = Object.entries(data.sessionHistory || {}).reduce((sum, [id, dates]) => {
    const s = PILATES_SESSIONS.find((x) => x.id === id);
    return sum + (s ? s.minutes * dates.length : 0);
  }, 0);
  let streak = 0;
  {
    const uniqueDays = new Set(allDates);
    let d = new Date();
    while (uniqueDays.has(dateKey(d))) {
      streak++;
      d.setDate(d.getDate() - 1);
    }
  }

  const favoriteSessions = PILATES_SESSIONS.filter((s) => favoriteIds.includes(s.id));

  return (
    <div>
      <Header title="Pilates" subtitle="Safe Place" />
      <div style={{ padding: "0 clamp(16px,5vw,22px)" }}>

            <div style={{ fontSize: 20, fontWeight: 600, color: ROSE_DARK, display: "flex", alignItems: "center", gap: 4, justifyContent: "center" }}>
              {streak > 0 && <Flame size={16} color="#D08A3E" />}
              {streak}
            </div>
            <div style={{ fontSize: 10.5, color: TEXT_MUTED, marginTop: 2 }}>jours de suite</div>
          </div>
          <div>
            <div style={{ fontSize: 20, fontWeight: 600, color: ROSE_DARK }}>{sessionsThisWeek}</div>
            <div style={{ fontSize: 10.5, color: TEXT_MUTED, marginTop: 2 }}>séances / 7j</div>

          <div>
            <div style={{ fontSize: 20, fontWeight: 600, color: ROSE_DARK }}>{totalMinutes}</div>
            <div style={{ fontSize: 10.5, color: TEXT_MUTED, marginTop: 2 }}>min au total</div>
          </div>
        </Card>

        {favoriteSessions.length > 0 && (

            </div>
            {favoriteSessions.map((s) => (
              <SessionCard key={s.id} s={s} data={data} isFav={true} onOpen={setPreview} onToggleFavorite={toggleFavorite} />

const TASK_CATEGORIES = [
  { key: "perso", label: "Perso", color: ROSE_DARK, bg: ROSE_LIGHT },
  { key: "maison", label: "Maison", color: SAGE, bg: SAGE_LIGHT },
  { key: "sport", label: "Sport", color: CORAL, bg: CORAL_LIGHT },
  { key: "autre", label: "Autre", color: "#8A7BB0", bg: "#EAE5F3" },
];
const catInfo = (key) => TASK_CATEGORIES.find((c) => c.key === key) || TASK_CATEGORIES[3];

function TasksScreen({ data, persist }) {
  const [text, setText] = useState("");
  const [category, setCategory] = useState("perso");
  const [filter, setFilter] = useState("all");
  const [editingId, setEditingId] = useState(null);
  const [editText, setEditText] = useState("");

  const addTask = () => {
    if (!text.trim()) return;
    persist({
      ...data,
      tasks: [{ id: uid(), text: text.trim(), done: false, createdAt: Date.now(), category }, ...data.tasks],
    });
    setText("");
  };

  const toggleDone = (id) => {
    persist({ ...data, tasks: data.tasks.map((t) => (t.id === id ? { ...t, done: !t.done } : t)) });
  };

  const removeTask = (id) => {
    persist({ ...data, tasks: data.tasks.filter((t) => t.id !== id) });
  };

  const startEdit = (t) => {
    setEditingId(t.id);
    setEditText(t.text);
  };

  const saveEdit = () => {
    if (editText.trim()) {
      persist({ ...data, tasks: data.tasks.map((t) => (t.id === editingId ? { ...t, text: editText.trim() } : t)) });
    }
    setEditingId(null);
  };

  const clearDone = () => {
    persist({ ...data, tasks: data.tasks.filter((t) => !t.done) });
  };

  const filtered = data.tasks.filter((t) => filter === "all" || (t.category || "autre") === filter);
  const sorted = [...filtered].sort((a, b) => a.done - b.done || b.createdAt - a.createdAt);
  const doneCount = data.tasks.filter((t) => t.done).length;
  const totalCount = data.tasks.length;
  const progress = totalCount > 0 ? (doneCount / totalCount) * 100 : 0;

  return (
    <div>
      <Header title="Tâches" subtitle="Safe Place" />
      <div style={{ padding: "0 clamp(16px,5vw,22px)" }}>
        <Card>
          <TextField
            placeholder="Ajouter une tâche..."
            value={text}
            onChange={(e) => setText(e.target.value)}
            onKeyDown={(e) => e.key === "Enter" && addTask()}
            style={{ marginBottom: 10 }}
          />
          <div style={{ display: "flex", gap: 6, marginBottom: 10, flexWrap: "wrap" }}>
            {TASK_CATEGORIES.map((c) => (
              <button
                key={c.key}
                onClick={() => setCategory(c.key)}
                style={{
                  border: category === c.key ? `1.5px solid ${c.color}` : `1px solid ${BORDER}`,
                  background: category === c.key ? c.bg : "transparent",
                  color: category === c.key ? c.color : TEXT_MUTED,
                  borderRadius: 999,
                  padding: "5px 12px",
                  fontSize: 11.5,
                  fontWeight: 500,
                  cursor: "pointer",
                }}
              >
                {c.label}
              </button>
            ))}
          </div>
          <PrimaryButton onClick={addTask} style={{ width: "100%", justifyContent: "center" }}>
            <Plus size={16} /> Ajouter
          </PrimaryButton>
        </Card>

        {totalCount > 0 && (
          <Card>
            <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 8 }}>
              <span style={{ fontSize: 12.5, color: TEXT_MUTED }}>
                {doneCount} / {totalCount} terminées
              </span>
              {doneCount > 0 && (
                <button
                  onClick={clearDone}
                  style={{ border: "none", background: "transparent", color: TEXT_MUTED, fontSize: 11.5, cursor: "pointer", textDecoration: "underline" }}
                >
                  Effacer terminées
                </button>
              )}
            </div>
            <div style={{ height: 6, background: BORDER, borderRadius: 999, overflow: "hidden" }}>
              <div style={{ height: "100%", width: `${progress}%`, background: SAGE, transition: "width 0.3s" }} />
            </div>
          </Card>
        )}

        <div style={{ display: "flex", gap: 6, marginBottom: 12, flexWrap: "wrap" }}>
          <button
            onClick={() => setFilter("all")}
            style={{
              border: `1px solid ${filter === "all" ? TEXT_MUTED : BORDER}`,
              background: filter === "all" ? CREAM : "transparent",
              color: filter === "all" ? TEXT : TEXT_MUTED,
              borderRadius: 999,
              padding: "5px 12px",
              fontSize: 11.5,
              fontWeight: 500,
              cursor: "pointer",
            }}
          >
            Tout
          </button>
          {TASK_CATEGORIES.map((c) => (
            <button
              key={c.key}
              onClick={() => setFilter(c.key)}
              style={{
                border: `1px solid ${filter === c.key ? c.color : BORDER}`,
                background: filter === c.key ? c.bg : "transparent",
                color: filter === c.key ? c.color : TEXT_MUTED,
                borderRadius: 999,
                padding: "5px 12px",
                fontSize: 11.5,
                fontWeight: 500,
                cursor: "pointer",
              }}
            >
              {c.label}
            </button>
          ))}
        </div>

        {sorted.length === 0 && (
          <p style={{ color: TEXT_MUTED, fontSize: 14, textAlign: "center", marginTop: 24 }}>Aucune tâche ici.</p>
        )}

        {sorted.map((t) => {
          const cat = catInfo(t.category);
          const isEditing = editingId === t.id;
          return (
            <Card key={t.id} style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 8 }}>
              <button
                onClick={() => toggleDone(t.id)}
                style={{
                  width: 24,
                  height: 24,
                  borderRadius: "50%",
                  border: `1.5px solid ${t.done ? SAGE : BORDER}`,
                  background: t.done ? SAGE : "transparent",
                  color: "#fff",
                  display: "flex",
                  alignItems: "center",
                  justifyContent: "center",
                  cursor: "pointer",
                  flexShrink: 0,
                }}
              >
                {t.done && <Check size={14} />}
              </button>
              <span style={{ width: 7, height: 7, borderRadius: "50%", background: cat.color, flexShrink: 0 }} />
              {isEditing ? (
                <input
                  autoFocus
                  value={editText}
                  onChange={(e) => setEditText(e.target.value)}
                  onKeyDown={(e) => e.key === "Enter" && saveEdit()}
                  onBlur={saveEdit}
                  style={{
                    flex: 1,
                    border: `1px solid ${BORDER}`,
                    borderRadius: 8,
                    padding: "4px 8px",
                    fontSize: 14,
                    color: TEXT,
                    background: CREAM,
                    outline: "none",
                  }}
                />
              ) : (
                <span
                  onClick={() => !t.done && startEdit(t)}
                  style={{
                    flex: 1,
                    fontSize: 14,
                    color: TEXT,
                    textDecoration: t.done ? "line-through" : "none",
                    opacity: t.done ? 0.5 : 1,
                    cursor: t.done ? "default" : "text",
                  }}
                >
                  {t.text}
                </span>
              )}
              {!isEditing && !t.done && (
                <IconButton onClick={() => startEdit(t)}>
                  <Pencil size={14} />
                </IconButton>
              )}
              <IconButton onClick={() => removeTask(t.id)} danger>
                <X size={16} />
              </IconButton>
            </Card>
          );
        })}
        <div style={{ height: 80 }} />
      </div>
    </div>
  );
}

function HydrationScreen({ data, persist }) {
  const today = todayKey();
  const count = data.hydration[today] || 0;

  const setCount = (v) => {
    persist({ ...data, hydration: { ...data.hydration, [today]: Math.max(0, Math.min(HYDRATION_MAX_GLASSES, v)) } });
  };

  const last7 = Array.from({ length: 7 }, (_, i) => {
    const d = new Date();
    d.setDate(d.getDate() - (6 - i));
    const key = dateKey(d);
    return { label: d.toLocaleDateString("fr-FR", { weekday: "short" }).slice(0, 2), value: data.hydration[key] || 0 };
  });

  return (
    <div>
      <Header title="Hydratation" subtitle="Safe Place" />
      <div style={{ padding: "0 clamp(16px,5vw,22px)" }}>
        <Card style={{ textAlign: "center", padding: "28px 18px" }}>
          <div style={{ fontSize: 42, fontWeight: 500, color: SAGE }}>
            {count}
            <span style={{ fontSize: 18, color: TEXT_MUTED }}> / {HYDRATION_GOAL_GLASSES}</span>
          </div>
          <div style={{ fontSize: 12, color: TEXT_MUTED, marginTop: 2, marginBottom: 18 }}>
            verres aujourd'hui ({(count * GLASS_ML) / 1000} L)
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(8, 1fr)", gap: 6, marginBottom: 20 }}>
            {Array.from({ length: HYDRATION_MAX_GLASSES }, (_, i) => (

              onClick={() => setCount(count - 1)}
              style={{
                width: 44,
                height: 44,
                borderRadius: "50%",
                border: `1.5px solid ${BORDER}`,

                fontSize: 18,
                color: TEXT_MUTED,
                cursor: "pointer",
              }}

            </button>

              onClick={() => setCount(count + 1)}
              style={{
                width: 44,
                height: 44,
                borderRadius: "50%",
                border: "none",
                background: SAGE,
                fontSize: 18,
                color: "#fff",
                cursor: "pointer",
              }}
            >
              +
            </button>
          </div>
        </Card>

        <Card>
          <div style={{ fontSize: 13, fontWeight: 500, color: TEXT, marginBottom: 12 }}>7 derniers jours</div>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-end", height: 80 }}>
            {last7.map((d, i) => (
              <div key={i} style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 6 }}>
                <div
                  style={{
                    width: 16,
                    height: Math.max(4, (d.value / HYDRATION_GOAL_GLASSES) * 56),
                    background: SAGE_LIGHT,
                    borderTop: `3px solid ${SAGE}`,
                    borderRadius: "4px 4px 0 0",
                  }}
                />
                <span style={{ fontSize: 10, color: TEXT_MUTED, textTransform: "capitalize" }}>{d.label}</span>
              </div>
            ))}
          </div>
        </Card>
        <div style={{ height: 80 }} />
      </div>
    </div>
  );
}

function FilmScreen() {
  const [active, setActive] = useState(null);
  const [pick, setPick] = useState(null);
  const [spinning, setSpinning] = useState(false);
  const [infoCat, setInfoCat] = useState(null);
  const spinRef = useRef(null);

  const spinTo = (cat, avoid) => {
    setActive(cat);
    setSpinning(true);
    let ticks = 0;
    const maxTicks = 12;
    spinRef.current = setInterval(() => {
      const t = cat.titles[Math.floor(Math.random() * cat.titles.length)];
      setPick(t);
      ticks++;
      if (ticks >= maxTicks) {
        clearInterval(spinRef.current);
        let final;
        do {
          final = cat.titles[Math.floor(Math.random() * cat.titles.length)];
        } while (final === avoid && cat.titles.length > 1);
        setPick(final);
        setSpinning(false);
      }
    }, 70);
  };

  const choose = (cat) => spinTo(cat, null);
  const reroll = () => active && spinTo(active, pick);

  useEffect(() => () => spinRef.current && clearInterval(spinRef.current), []);

  return (
    <div>
      <Header title="Film" subtitle="Safe Place" />
      <div style={{ padding: "0 clamp(16px,5vw,22px)" }}>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 14 }}>
          {FILM_CATEGORIES.map((cat) => (
            <div
              key={cat.key}
              onClick={() => choose(cat)}
              style={{
                position: "relative",
                border: active?.key === cat.key ? `2px solid ${cat.color}` : `1px solid ${BORDER}`,
                background: cat.bg,
                color: cat.color,
                borderRadius: 16,
                padding: "18px 34px 18px 10px",
                fontSize: 14,
                fontWeight: 500,
                cursor: "pointer",
                textAlign: "center",
              }}
            >
              {cat.label}
              <button
                onClick={(e) => {
                  e.stopPropagation();
                  setInfoCat(infoCat?.key === cat.key ? null : cat);
                }}
                style={{
                  position: "absolute",
                  top: 8,
                  right: 8,
                  width: 22,
                  height: 22,
                  borderRadius: "50%",
                  border: `1px solid ${cat.color}`,
                  background: "rgba(255,255,255,0.6)",
                  color: cat.color,
                  fontSize: 11,
                  fontWeight: 700,
                  fontStyle: "italic",
                  fontFamily: "Georgia, serif",
                  display: "flex",
                  alignItems: "center",
                  justifyContent: "center",
                  cursor: "pointer",
                  lineHeight: 1,
                }}
                aria-label={`Voir tous les films ${cat.label}`}
              >
                i
              </button>
            </div>
          ))}
        </div>

        {infoCat && (
          <Card style={{ background: infoCat.bg, border: "none" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
              <span style={{ fontSize: 12, textTransform: "uppercase", letterSpacing: "0.08em", color: infoCat.color, fontWeight: 600 }}>
                Tous les titres — {infoCat.label}
              </span>
              <IconButton onClick={() => setInfoCat(null)}>
                <X size={16} />
              </IconButton>
            </div>
            <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
              {infoCat.titles.map((t, i) => (
                <span
                  key={i}
                  style={{
                    fontSize: 12.5,
                    color: TEXT,
                    background: "rgba(255,255,255,0.7)",
                    borderRadius: 999,
                    padding: "5px 11px",
                  }}
                >
                  {t}
                </span>
              ))}
            </div>
          </Card>
        )}

        {pick && (
          <>
            <style>{`
              @keyframes filmPop { 0% { transform: scale(0.94); opacity: 0.6; } 100% { transform: scale(1); opacity: 1; } }
              @keyframes filmSpin { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
            `}</style>
            <Card
              style={{
                textAlign: "center",
                padding: "28px 18px",
                background: active.bg,
                border: "none",
                animation: spinning ? "filmSpin 0.14s ease-in-out infinite" : "filmPop 0.3s ease-out",
              }}
            >
              <div style={{ fontSize: 11, textTransform: "uppercase", letterSpacing: "0.1em", color: active.color, marginBottom: 8 }}>
                {spinning ? "Tirage en cours..." : active.label}
              </div>
              <div
                style={{
                  fontFamily: "Georgia, serif",
                  fontStyle: "italic",
                  fontSize: 24,
                  color: TEXT,
                  marginBottom: 18,
                  opacity: spinning ? 0.55 : 1,
                  transition: "opacity 0.1s",
                }}
              >
                {pick}
              </div>
              <PrimaryButton
                onClick={reroll}
                color={active.color}
                style={{ margin: "0 auto", opacity: spinning ? 0.6 : 1, pointerEvents: spinning ? "none" : "auto" }}
              >
                <Shuffle size={15} style={spinning ? { animation: "filmSpin 0.3s linear infinite" } : undefined} /> Autre suggestion
              </PrimaryButton>
            </Card>
          </>
        )}

        {!pick && (
          <p style={{ color: TEXT_MUTED, fontSize: 14, textAlign: "center", marginTop: 24 }}>
            Choisis une catégorie pour une suggestion au hasard.
          </p>
        )}
        <div style={{ height: 80 }} />
      </div>
    </div>
  );
}

function VerseCard({ verse, isFav, onToggleFav, big }) {
  const [copied, setCopied] = useState(false);

  const copyVerse = () => {
    const full = `« ${verse.text} » — ${verse.ref}`;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(full).then(() => {
        setCopied(true);
        setTimeout(() => setCopied(false), 1600);
      });
    }
  };

  return (
    <Card style={{ background: `linear-gradient(150deg, ${ROSE_LIGHT} 0%, #FBF3EF 100%)`, border: "none", position: "relative", padding: "22px 20px 18px" }}>
      <div
        style={{
          fontFamily: "Georgia, serif",
          fontSize: 46,
          color: "rgba(140,90,100,0.18)",
          position: "absolute",
          top: 4,
          left: 12,
          lineHeight: 1,
        }}
      >
        "
      </div>
      <div
        style={{
          display: "inline-block",
          fontSize: 10.5,
          textTransform: "uppercase",
          letterSpacing: "0.08em",
          color: ROSE_DARK,
          fontWeight: 700,
          background: "rgba(255,255,255,0.6)",
          borderRadius: 999,
          padding: "3px 10px",
          marginBottom: 12,
        }}
      >
        {verse.ref}
      </div>
      <div
        style={{
          fontFamily: "Georgia, serif",
          fontStyle: "italic",
          fontSize: big ? 17 : 15.5,
          color: TEXT,
          lineHeight: 1.65,
          marginBottom: 16,
          position: "relative",
          zIndex: 1,
        }}
      >
        {verse.text}
      </div>
      <div style={{ display: "flex", alignItems: "center", gap: 16 }}>
        <button
          onClick={onToggleFav}
          style={{
            border: "none",
            background: "transparent",
            color: isFav ? "#C9576B" : TEXT_MUTED,
            display: "flex",
            alignItems: "center",
            gap: 5,
            fontSize: 12.5,
            fontWeight: 500,
            cursor: "pointer",
            padding: 0,
          }}
        >
          <Heart size={15} fill={isFav ? "#C9576B" : "none"} />
          {isFav ? "Coup de cœur" : "Ajouter"}
        </button>
        <button
          onClick={copyVerse}
          style={{
            border: "none",
            background: "transparent",
            color: copied ? SAGE : TEXT_MUTED,
            display: "flex",
            alignItems: "center",
            gap: 5,
            fontSize: 12.5,
            fontWeight: 500,
            cursor: "pointer",
            padding: 0,
          }}
        >
          {copied ? <Check size={14} /> : <Share2 size={14} />}
          {copied ? "Copié" : "Copier"}
        </button>
      </div>
    </Card>
  );
}

function ReligionScreen({ data, persist }) {
  const [sub, setSub] = useState("jour");
  const [mood, setMood] = useState(null);
  const [dayOffset, setDayOffset] = useState(0); // 0 = aujourd'hui, négatif = jours passés

  const favs = data.favoriteVerses || [];
  const isFav = (v) => favs.some((f) => f.ref === v.ref);
  const toggleFav = (v) => {
    persist({
      ...data,
      favoriteVerses: isFav(v) ? favs.filter((f) => f.ref !== v.ref) : [...favs, v],
    });
  };

  const viewDate = new Date();
  viewDate.setDate(viewDate.getDate() + dayOffset);
  const viewVerse = DAILY_VERSES[dayOfYear(viewDate) % DAILY_VERSES.length];
  const isToday = dayOffset === 0;

  // suivi de régularité (jours où le verset du jour a été consulté)
  useEffect(() => {
    if (sub !== "jour" || !isToday) return;
    const log = data.verseReadDates || [];
    if (!log.includes(todayKey())) {
      persist({ ...data, verseReadDates: [...log, todayKey()].slice(-90) });
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [sub, isToday]);

  let streak = 0;
  {
    const days = new Set(data.verseReadDates || []);
    let d = new Date();
    while (days.has(dateKey(d))) {
      streak++;
      d.setDate(d.getDate() - 1);
    }
  }

  return (
    <div>
      <Header title="Foi" subtitle="Safe Place" />
      <div style={{ padding: "0 clamp(16px,5vw,22px)" }}>
        <div style={{ display: "flex", gap: 6, marginBottom: 14, flexWrap: "wrap" }}>
          {[
            ["jour", "Verset du jour"],
            ["emotions", "Émotions"],
            ["favoris", "Coups de cœur"],
          ].map(([key, label]) => (
            <button
              key={key}
              onClick={() => setSub(key)}
              style={{
                border: `1px solid ${sub === key ? ROSE : BORDER}`,
                background: sub === key ? ROSE_LIGHT : "transparent",
                color: sub === key ? ROSE_DARK : TEXT_MUTED,
                borderRadius: 999,
                padding: "6px 14px",
                fontSize: 12,
                fontWeight: 500,
                cursor: "pointer",
              }}
            >
              {label}
              {key === "favoris" && favs.length > 0 && (
                <span style={{ marginLeft: 5, opacity: 0.7 }}>({favs.length})</span>
              )}
            </button>
          ))}
        </div>

        {sub === "jour" && (
          <>
            {streak > 1 && (
              <div
                style={{
                  display: "flex",
                  alignItems: "center",
                  gap: 6,
                  fontSize: 12,
                  color: "#D08A3E",
                  marginBottom: 10,
                  fontWeight: 500,
                }}
              >
                <Flame size={14} /> {streak} jours de lecture consécutifs
              </div>
            )}
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 10 }}>
              <button
                onClick={() => setDayOffset((d) => Math.max(-13, d - 1))}
                style={{ border: "none", background: "transparent", color: TEXT_MUTED, cursor: "pointer", padding: 4 }}
              >
                <ChevronLeft size={18} />
              </button>
              <span style={{ fontSize: 12.5, color: TEXT_MUTED, textTransform: "capitalize" }}>
                {isToday ? "Aujourd'hui" : viewDate.toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" })}
              </span>
              <button
                onClick={() => setDayOffset((d) => Math.min(0, d + 1))}
                disabled={isToday}
                style={{ border: "none", background: "transparent", color: isToday ? BORDER : TEXT_MUTED, cursor: isToday ? "default" : "pointer", padding: 4 }}
              >
                <ChevronRight size={18} />
              </button>
            </div>
            <VerseCard verse={viewVerse} isFav={isFav(viewVerse)} onToggleFav={() => toggleFav(viewVerse)} big />
            {!isToday && (
              <button
                onClick={() => setDayOffset(0)}
                style={{ border: "none", background: "transparent", color: ROSE_DARK, fontSize: 12, textDecoration: "underline", cursor: "pointer", padding: 0, marginTop: 4 }}
              >
                Revenir à aujourd'hui
              </button>
            )}
          </>
        )}

        {sub === "emotions" && (
          <>
            <p style={{ color: TEXT_MUTED, fontSize: 13, marginBottom: 12 }}>Comment tu te sens en ce moment ?</p>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(2, 1fr)", gap: 8, marginBottom: 14 }}>
              {emotionKeys.map((key) => {
                const Icon = EMOTION_ICONS[key];
                const activeMood = mood === key;
                return (
                  <button
                    key={key}
                    onClick={() => setMood(key)}
                    style={{
                      border: activeMood ? `2px solid ${ROSE}` : `1px solid ${BORDER}`,
                      background: activeMood ? ROSE_LIGHT : CARD,
                      color: activeMood ? ROSE_DARK : TEXT,
                      borderRadius: 14,
                      padding: "12px 10px",
                      fontSize: 13,
                      fontWeight: 500,
                      cursor: "pointer",
                      display: "flex",
                      alignItems: "center",
                      gap: 8,
                    }}
                  >
                    <Icon size={16} color={activeMood ? ROSE_DARK : TEXT_MUTED} />
                    {EMOTION_VERSES[key].label}
                  </button>
                );
              })}
            </div>
            {mood ? (
              EMOTION_VERSES[mood].verses.map((v, i) => (
                <VerseCard key={i} verse={v} isFav={isFav(v)} onToggleFav={() => toggleFav(v)} />
              ))
            ) : (
              <p style={{ color: TEXT_MUTED, fontSize: 14, textAlign: "center", marginTop: 24 }}>
                Choisis comment tu te sens pour recevoir des versets adaptés.
              </p>
            )}
          </>
        )}

        {sub === "favoris" && (
          <>
            {favs.length === 0 && (
              <p style={{ color: TEXT_MUTED, fontSize: 14, textAlign: "center", marginTop: 24 }}>
                Aucun verset en coup de cœur pour l'instant. Touche le cœur sur un verset pour le garder ici.
              </p>
            )}
            {favs.map((v, i) => (
              <VerseCard key={i} verse={v} isFav={true} onToggleFav={() => toggleFav(v)} />
            ))}
          </>
        )}
        <div style={{ height: 80 }} />
      </div>
    </div>
  );
}

    const t = e.target;
    if (t.closest && t.closest("button, a, input, textarea")) {
      touchStartX.current = null;
      touchStartY.current = null;
      return;
    }
    touchStartX.current = e.touches[0].clientX;
    touchStartY.current = e.touches[0].clientY;
  };

  const handleTouchEnd = (e) => {
    if (touchStartX.current === null) return;
    const dx = e.changedTouches[0].clientX - touchStartX.current;
    const dy = e.changedTouches[0].clientY - (touchStartY.current || 0);
    touchStartX.current = null;
    touchStartY.current = null;
    if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
    const idx = TABS.findIndex((t) => t.key === tab);
    if (dx < 0 && idx < TABS.length - 1) setTab(TABS[idx + 1].key);
    else if (dx > 0 && idx > 0) setTab(TABS[idx - 1].key);
  };

  if (!started) {
    return <WelcomeScreen onContinue={() => setStarted(true)} />;
  }

  if (!loaded) {
    return (
      <div
        style={{
          height: "100dvh",
          display: "flex",
          alignItems: "center",
          justifyContent: "center",
          background: CREAM,
          fontFamily: "system-ui, sans-serif",
          color: TEXT_MUTED,
          fontSize: 14,
        }}
      >
        Chargement...
      </div>
    );
  }

  return (
    <div
      style={{
        height: "100dvh",
        width: "100%",
        background: `linear-gradient(180deg, ${ROSE_LIGHT} 0%, ${CREAM} 220px)`,
        fontFamily: "-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif",
        maxWidth: 480,
        margin: "0 auto",
        position: "relative",
        boxSizing: "border-box",
        overflow: "hidden",
      }}
    >
      <div
        onTouchStart={handleTouchStart}
        onTouchEnd={handleTouchEnd}
        style={{
          height: "100%",
          width: "100%",
          overflowY: "auto",
          overscrollBehaviorY: "contain",
          WebkitOverflowScrolling: "touch",
          paddingBottom: 66,
          boxSizing: "border-box",
          touchAction: "pan-y",
        }}
      >
        <style>{`
          @keyframes fadeSlideIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        `}</style>
        <div key={tab} style={{ animation: "fadeSlideIn 0.22s ease" }}>
          {tab === "pills" && <PillsScreen data={data} persist={persist} />}
          {tab === "sport" && <PilatesScreen data={data} persist={persist} />}
          {tab === "tasks" && <TasksScreen data={data} persist={persist} />}
          {tab === "hydration" && <HydrationScreen data={data} persist={persist} />}
          {tab === "film" && <FilmScreen />}
          {tab === "religion" && <ReligionScreen data={data} persist={persist} />}
        </div>
      </div>

      <div
        style={{
          position: "absolute",
          bottom: 0,
          left: 0,
          width: "100%",
          background: "rgba(251,243,239,0.94)",
          backdropFilter: "blur(8px)",
          borderTop: `1px solid ${BORDER}`,
          boxShadow: "0 -4px 16px rgba(140,90,100,0.08)",
          display: "flex",
          justifyContent: "space-around",
          padding: "8px 2px calc(8px + env(safe-area-inset-bottom))",
          zIndex: 10,
        }}
      >
        {TABS.map(({ key, label, icon: Icon }) => {
          const active = tab === key;
          return (
            <button
              key={key}
              onClick={() => setTab(key)}
              style={{
                display: "flex",
                flexDirection: "column",
                alignItems: "center",
                gap: 2,
                border: "none",
                background: "transparent",
                cursor: "pointer",
                color: active ? ROSE_DARK : TEXT_MUTED,
                padding: "4px 6px",
                borderRadius: 14,
                flex: 1,
                minWidth: 0,
              }}
            >
              <div
                style={{
                  width: 32,
                  height: 32,
                  borderRadius: "50%",
                  background: active ? ROSE_LIGHT : "transparent",
                  display: "flex",
                  alignItems: "center",
                  justifyContent: "center",
                  position: "relative",
                  transition: "background 0.2s",
                }}
              >
                {active && (
                  <span
                    style={{
                      position: "absolute",
                      top: -7,
                      width: 4,
                      height: 4,
                      borderRadius: "50%",
                      background: ROSE_DARK,
                    }}
                  />
                )}
                <Icon size={17} strokeWidth={active ? 2 : 1.5} />
              </div>
              <span style={{ fontSize: 9.5, fontWeight: active ? 500 : 400, whiteSpace: "nowrap" }}>{label}</span>
            </button>
          );
        })}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<Hub />);
</script>

<script>
  function runApp() {
    try {
      var source = document.getElementById("app-source").textContent;
      var compiled = Babel.transform(source, {
        presets: [["react", { runtime: "classic" }]]
      }).code;
      var scriptEl = document.createElement("script");
      scriptEl.textContent = compiled;
      document.body.appendChild(scriptEl);
    } catch (e) {
      document.getElementById("root").innerHTML =
        "<div style='padding:40px;font-family:sans-serif;color:#7A4A3D;text-align:center;'>Erreur au chargement de l'app :<br>" + e.message + "</div>";
      console.error(e);
    }
  }

  var attempts = 0;
  var maxAttempts = 100; // 100 x 150ms = 15s
  function waitForDeps() {
    attempts++;
    if (window.React && window.ReactDOM && window.Babel) {
      runApp();
    } else if (attempts >= maxAttempts) {
      document.getElementById("root").innerHTML =
        "<div style='padding:40px;font-family:sans-serif;color:#7A4A3D;text-align:center;'>Impossible de charger les composants nécessaires (vérifie ta connexion internet), puis recharge la page.</div>";
    } else {
      setTimeout(waitForDeps, 150);
    }
  }
  waitForDeps();
</script>
</body>
</html>
